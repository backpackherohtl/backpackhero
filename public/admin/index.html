<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Backpack Hero</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 80'%3E%3Cpath d='M24 14 V10 A8 8 0 0 1 40 10 V14' fill='none' stroke='%2315171A' stroke-width='6'/%3E%3Crect x='4' y='14' width='56' height='62' rx='12' fill='%2315171A'/%3E%3Crect x='15' y='26' width='7' height='38' fill='%23C8412F'/%3E%3Crect x='28.5' y='26' width='7' height='38' fill='%232F7A4D'/%3E%3Crect x='42' y='26' width='7' height='38' fill='%23E2B13C'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Archivo";font-weight:400;font-display:swap;src:url(/fonts/archivo-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:600;font-display:swap;src:url(/fonts/archivo-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:800;font-display:swap;src:url(/fonts/archivo-latin-800-normal.woff2) format("woff2")}
:root{--dunkel:#15171A;--hell:#F3F0E8;--hell-2:#E9E5DA;--linie:#D6D1C4;--text-2:#55514A;--rot:#C8412F;--gruen:#2F7A4D;--gelb:#E2B13C;--r:18px;--r-gross:28px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--hell);color:var(--dunkel);font:400 16px/1.5 "Archivo",system-ui,sans-serif}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.015em;line-height:1.1}
h1{font-size:30px;font-weight:800}
h2{font-size:21px;font-weight:800}
h3{font-size:17px;font-weight:800}
p{margin:0}
.muted{color:var(--text-2)}
.small{font-size:14px}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;background:var(--dunkel);color:var(--hell)}
.top-in{max-width:1240px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--hell)}
.brand b{font-size:15px;font-weight:800;letter-spacing:.06em}
.brand span{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;background:var(--gelb);color:var(--dunkel);padding:3px 8px;border-radius:999px}
.top .who{margin-left:auto;font-size:14px;color:#B7B2A6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.top a.lnk{font-size:14px;font-weight:600;color:var(--hell);text-decoration:none;padding:8px 12px;border-radius:999px;border:1.5px solid rgba(243,240,232,.25);white-space:nowrap}
.top a.lnk:hover{background:rgba(243,240,232,.08)}

/* Layout */
.layout{max-width:1240px;margin:0 auto;padding:28px 20px 80px;display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start}
nav.tabs{position:sticky;top:92px;display:grid;gap:4px}
nav.tabs button{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:14px;font-weight:600;color:var(--text-2);cursor:pointer;min-height:44px}
nav.tabs button:hover{background:var(--hell-2);color:var(--dunkel)}
nav.tabs button[aria-selected=true]{background:var(--dunkel);color:var(--hell)}
nav.tabs .cnt{font-size:12px;font-weight:800;background:var(--rot);color:#fff;border-radius:999px;padding:1px 8px}
nav.tabs .cnt:empty{display:none}
main{min-width:0}
.panel{display:grid;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--linie);border-radius:var(--r-gross);padding:26px}
.card > h2{margin-bottom:6px}
.card > .muted{margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:end}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

/* Kennzahlen */
.stat{background:#fff;border:1px solid var(--linie);border-radius:var(--r);padding:20px;display:grid;gap:4px;align-content:start}
.stat .lbl{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2)}
.stat .val{font-size:30px;font-weight:800;line-height:1.1}
.stat .sub{font-size:14px;color:var(--text-2)}
.stat.dark{background:var(--dunkel);color:var(--hell);border-color:var(--dunkel)}
.stat.dark .lbl,.stat.dark .sub{color:#B7B2A6}
.pill{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:5px 12px;border-radius:999px;background:var(--hell-2)}
.pill i{width:9px;height:9px;border-radius:50%;display:block}

/* Formulare */
form{display:grid;gap:16px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
label .hint{font-weight:400;color:var(--text-2)}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],input[type=url],select,textarea{background:var(--hell);border:1.5px solid var(--linie);border-radius:14px;padding:11px 14px;min-height:46px;width:100%;font-size:16px;font-weight:400}
textarea{min-height:92px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--dunkel);background:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font-weight:600;border:2px solid var(--dunkel);background:var(--dunkel);color:var(--hell);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.leer{background:transparent;color:var(--dunkel)}
.btn.leer:hover{background:var(--hell-2)}
.btn.rot{background:var(--rot);border-color:var(--rot)}
.btn.klein{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:36px;height:36px;border-radius:12px;border:1.5px solid var(--linie);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon:hover{border-color:var(--dunkel)}
.icon svg{width:18px;height:18px}

/* Schalter */
.switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-radius:16px;background:var(--hell);cursor:pointer}
.switch .txt{display:grid;gap:2px}
.switch .txt b{font-weight:700}
.switch .txt span{font-size:14px;font-weight:400;color:var(--text-2)}
.switch input{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:var(--linie);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked{background:var(--gruen)}
.switch input:checked::after{transform:translateX(22px)}
.switch input:focus-visible{outline:2px solid var(--dunkel);outline-offset:2px}

/* Listen */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:#fff;border:1px solid var(--linie);border-radius:var(--r);padding:14px 16px}
.item.alt{opacity:.55}
.item .date{width:64px;text-align:center;border-radius:14px;background:var(--hell);padding:8px 4px}
.item .date b{display:block;font-size:22px;font-weight:800;line-height:1}
.item .date span{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2)}
.item .main{min-width:0;display:grid;gap:2px}
.item .main b{font-size:16px}
.item .acts{display:flex;gap:6px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--hell-2);color:var(--text-2);vertical-align:middle;margin-left:6px}
.empty{padding:28px;text-align:center;color:var(--text-2);background:#fff;border:1px dashed var(--linie);border-radius:var(--r)}

/* Tabellen */
.tablewrap{overflow-x:auto;border:1px solid var(--linie);border-radius:var(--r);background:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--hell-2);vertical-align:top}
th{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);background:var(--hell);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums}

/* Bestellungen */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--linie);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;min-height:40px}
.chip[aria-pressed=true]{background:var(--dunkel);color:var(--hell);border-color:var(--dunkel)}
.chip small{font-weight:800}
.order{background:#fff;border:1px solid var(--linie);border-radius:var(--r)}
.order summary{list-style:none;display:grid;grid-template-columns:130px 1fr auto auto;gap:14px;align-items:center;padding:14px 16px;cursor:pointer}
.order summary::-webkit-details-marker{display:none}
.order .nr{font-weight:800;font-variant-numeric:tabular-nums}
.order .body{padding:0 16px 18px;display:grid;gap:14px;border-top:1px solid var(--hell-2);padding-top:16px}
.order dl{margin:0;display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:15px}
.order dt{color:var(--text-2)}
.order dd{margin:0;overflow-wrap:anywhere}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;display:block}
.st-neu{background:#F7E3DF;color:#93301F}.st-neu i{background:var(--rot)}
.st-bezahlt{background:#F8EDD1;color:#7A5A12}.st-bezahlt i{background:var(--gelb)}
.st-versendet,.st-abgeholt{background:#DCEBE1;color:#215A38}.st-versendet i,.st-abgeholt i{background:var(--gruen)}
.st-storniert{background:var(--hell-2);color:var(--text-2)}.st-storniert i{background:#9E988B}

/* Protokoll */
.log{display:grid;gap:0}
.log .e{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--hell-2)}
.log .e:last-child{border-bottom:0}
.log .when{font-size:14px;color:var(--text-2);font-variant-numeric:tabular-nums}
.log .what b{display:block}
.log .what pre{margin:4px 0 0;white-space:pre-wrap;font:inherit;font-size:14px;color:var(--text-2)}

/* Meldungen */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--dunkel);color:var(--hell);padding:12px 20px;border-radius:999px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);transition:all .25s;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--rot)}
.note{border-radius:16px;padding:14px 16px;background:#F8EDD1;font-size:15px}
.loading{padding:60px;text-align:center;color:var(--text-2)}

@media (max-width:960px){
  .layout{grid-template-columns:1fr;padding-top:16px}
  nav.tabs{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:6px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
  nav.tabs button{white-space:nowrap;flex:none}
  .grid4{grid-template-columns:1fr 1fr}
  .grid3,.grid2{grid-template-columns:1fr}
  .top .who{display:none}
}
@media (max-width:620px){
  .card{padding:20px}
  .order summary{grid-template-columns:1fr auto;grid-template-areas:"nr st" "nm nm";row-gap:4px}
  .order summary .nr{grid-area:nr}.order summary .nm{grid-area:nm}.order summary .st{grid-area:st;justify-self:end}
  .brand b{font-size:13px;white-space:nowrap}
  .order summary .hide-m{display:none}
  .order dl{grid-template-columns:1fr}
  .order dt{margin-top:6px}
  .log .e{grid-template-columns:1fr;gap:2px}
  .item{grid-template-columns:auto 1fr}
  .item .acts{grid-column:1/-1;justify-content:flex-end}
  h1{font-size:26px}
  .top a.lnk.web{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/admin/">
      <svg width="24" height="30" viewBox="0 0 64 80" aria-hidden="true"><path d="M24 14 V10 A8 8 0 0 1 40 10 V14" fill="none" stroke="#F3F0E8" stroke-width="5"/><rect x="4" y="14" width="56" height="62" rx="12" fill="#F3F0E8"/><rect x="16" y="26" width="5" height="38" rx="1" fill="#C8412F"/><rect x="29.5" y="26" width="5" height="38" rx="1" fill="#2F7A4D"/><rect x="43" y="26" width="5" height="38" rx="1" fill="#E2B13C"/></svg>
      <b>BACKPACK HERO</b><span>Admin</span>
    </a>
    <div class="who" id="who"></div>
    <a class="lnk web" href="/" target="_blank" rel="noopener">Zur Website</a>
    <a class="lnk" href="/cdn-cgi/access/logout">Abmelden</a>
  </div>
</header>

<div class="layout">
  <nav class="tabs" role="tablist" aria-label="Bereiche">
    <button role="tab" data-tab="uebersicht" aria-selected="true">Übersicht</button>
    <button role="tab" data-tab="termine">Termine</button>
    <button role="tab" data-tab="verkauf">Verkauf</button>
    <button role="tab" data-tab="bestellungen">Bestellungen <span class="cnt" id="cntNeu"></span></button>
    <button role="tab" data-tab="mailliste">Mail-Liste</button>
    <button role="tab" data-tab="texte">Texte &amp; Banner</button>
    <button role="tab" data-tab="protokoll">Protokoll</button>
  </nav>

  <main id="main"><div class="loading">Wird geladen …</div></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';

  /* ---------- Werkzeuge ---------- */
  function h(tag, attrs){
    var e = document.createElement(tag);
    if(attrs) for(var k in attrs){
      var v = attrs[k];
      if(v === null || v === undefined || v === false) continue;
      if(k === 'class') e.className = v;
      else if(k === 'text') e.textContent = v;
      else if(k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
      else if(v === true) e.setAttribute(k, '');
      else e.setAttribute(k, v);
    }
    for(var i = 2; i < arguments.length; i++){
      var c = arguments[i];
      if(c === null || c === undefined || c === false) continue;
      if(Array.isArray(c)) c.forEach(function(x){ if(x) e.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); });
      else e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return e;
  }
  function svg(d){ var s = document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none'); s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','2'); s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round'); s.setAttribute('aria-hidden','true'); s.innerHTML = d; return s; }
  var I = {
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
    del: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    eyeoff: '<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'
  };
  function icon(name, label, onclick){ return h('button', {class:'icon', type:'button', 'aria-label':label, title:label, onclick:onclick}, svg(I[name])); }
  var toastT;
  function toast(t, err){ var e = document.getElementById('toast'); e.textContent = t; e.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(function(){ e.className = 'toast'; }, 3200); }
  function api(method, path, body){
    return fetch('/api/admin/' + path, {
      method: method, credentials: 'same-origin',
      headers: body ? {'content-type':'application/json','x-bh-admin':'1'} : {'x-bh-admin':'1'},
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      if(r.status === 401 || r.status === 403){ toast('Sitzung abgelaufen. Seite wird neu geladen …', true); setTimeout(function(){ location.reload(); }, 1500); throw new Error('auth'); }
      return r.json().then(function(j){ if(!j.ok && j.error){ throw new Error(j.error); } return j; });
    });
  }
  function fail(e){ if(e && e.message !== 'auth') toast(e.message || 'Fehler beim Speichern.', true); }
  var TAGE = ['So','Mo','Di','Mi','Do','Fr','Sa'], MON = ['Jän','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  function d8(iso){ var p = iso.split('-'); return new Date(+p[0], p[1]-1, +p[2]); }
  function dat(iso){ var d = d8(iso); return TAGE[d.getDay()] + ', ' + d.getDate() + '. ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
  function ts(iso){ var d = new Date(iso); return d.toLocaleDateString('de-AT', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' ' + d.toLocaleTimeString('de-AT', {hour:'2-digit', minute:'2-digit'}); }
  function euro(c){ return c === null || c === undefined ? '' : (c / 100).toFixed(2).replace('.', ',') + ' €'; }
  function wer(e){ return (e || '').replace(/@.*/, ''); }
  function download(name, text, type){ var a = h('a', {href: URL.createObjectURL(new Blob([text], {type: type})), download: name}); document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500); }
  function csv(rows){ return '﻿' + rows.map(function(r){ return r.map(function(v){ v = v === null || v === undefined ? '' : String(v); if(/^[=+\-@]/.test(v)) v = "'" + v; return /[";\n,]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }).join('\r\n'); }
  function sw(name, title, sub, checked){
    return h('label', {class:'switch'}, h('span', {class:'txt'}, h('b', {text:title}), sub ? h('span', {text:sub}) : null), h('input', {type:'checkbox', name:name, role:'switch', checked: !!checked}));
  }
  function field(label, input, hint){ return h('label', null, h('span', null, label, hint ? h('span', {class:'hint', text:' ' + hint}) : null), input); }
  function inp(name, value, attrs){ var a = {type:'text', name:name, value: value || ''}; for(var k in attrs) a[k] = attrs[k]; return h('input', a); }

  /* ---------- Zustand ---------- */
  var D = null, tab = 'uebersicht', main = document.getElementById('main');
  var STATUS = [['neu','Neu'],['bezahlt','Bezahlt'],['versendet','Versendet'],['abgeholt','Abgeholt'],['storniert','Storniert']];
  function status(s){ var l = STATUS.filter(function(x){ return x[0] === s; })[0]; return h('span', {class:'st st-' + s}, h('i'), l ? l[1] : s); }

  function load(){
    return api('GET', 'data').then(function(d){
      D = d;
      document.getElementById('who').textContent = 'Angemeldet als ' + d.email;
      var neu = (d.bestellungen.filter(function(x){ return x.status === 'neu'; })[0] || {}).n || 0;
      document.getElementById('cntNeu').textContent = neu ? neu : '';
      render();
    }).catch(function(e){ if(e.message !== 'auth') main.innerHTML = '<div class="empty">Konnte die Daten nicht laden. Bitte Seite neu laden.</div>'; });
  }
  function render(){
    main.innerHTML = '';
    var p = ({uebersicht: pUebersicht, termine: pTermine, verkauf: pVerkauf, bestellungen: pBestellungen, mailliste: pMailliste, texte: pTexte, protokoll: pProtokoll})[tab]();
    main.appendChild(p);
  }
  document.querySelectorAll('nav.tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      tab = b.getAttribute('data-tab');
      document.querySelectorAll('nav.tabs button').forEach(function(x){ x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
      try { history.replaceState(null, '', '#' + tab); } catch(e){}
      if(D) render(); window.scrollTo(0, 0);
    });
  });
  var start = (location.hash || '').slice(1);
  if(start){ var sb = document.querySelector('nav.tabs button[data-tab="' + start + '"]'); if(sb){ tab = start; document.querySelectorAll('nav.tabs button').forEach(function(x){ x.setAttribute('aria-selected', x === sb ? 'true' : 'false'); }); } }
  function go(t){ document.querySelector('nav.tabs button[data-tab="' + t + '"]').click(); }
  window.addEventListener('hashchange', function(){ var t = (location.hash || '').slice(1); if(t && t !== tab && document.querySelector('nav.tabs button[data-tab="' + t + '"]')) go(t); });

  /* ---------- Übersicht ---------- */
  function modus(s){
    var stock = s.stueck_verfuegbar === '' ? null : +s.stueck_verfuegbar;
    if(s.ausverkauft === '1' || (stock !== null && stock <= 0)) return ['Ausverkauft', 'var(--rot)'];
    if(s.bestellen_offen === '1') return ['Bestellen offen', 'var(--gruen)'];
